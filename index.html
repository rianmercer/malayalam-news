<!doctype html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2a4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="malayalam-news-logo.webp" type="image/webp">
<link rel="apple-touch-icon" href="malayalam-news-logo.webp">
<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="//www.youtube.com">
<link rel="dns-prefetch" href="//i.ytimg.com">
<title>Malayalam News</title>
<style>
  :root { --bg:#0b2a4a; --card:#ffffff; --ink:#111; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); font-family:system-ui,"Noto Sans Malayalam",sans-serif; }
  header { color:#fff; text-align:center; padding:14px 8px 6px; font-size:26px; font-weight:700; }
  header small { display:block; font-size:18px; font-weight:400; opacity:.85; margin-top:2px; }
  #grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:12px; padding-bottom:max(24px, env(safe-area-inset-bottom)); }
  .tile { background:var(--card); border:0; border-radius:20px; min-height:190px; padding:10px 8px;
          display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
          font:inherit; color:var(--ink); box-shadow:0 4px 0 rgba(0,0,0,.35); }
  .tile:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.35); }
  .logo { width:100%; height:120px; display:flex; align-items:center; justify-content:center; }
  .logo img { max-width:92%; max-height:120px; object-fit:contain; border-radius:12px; }
  .badge { overflow-wrap:anywhere; }
  .badge { width:100%; height:120px; border-radius:12px; color:#fff; display:flex; align-items:center; justify-content:center;
           font-size:28px; font-weight:800; text-align:center; line-height:1.1; padding:4px; }
  .name { font-size:24px; font-weight:700; text-align:center; line-height:1.2; }
  #player { display:none; position:fixed; inset:0; background:#000; flex-direction:column; }
  #player.on { display:flex; }
  #bar { display:flex; gap:10px; padding:10px; padding-top:max(10px, env(safe-area-inset-top)); background:#000; }
  #bar button, #bar a { flex:1; font:inherit; font-size:24px; font-weight:700; border:0; border-radius:16px; min-height:64px;
                        display:flex; align-items:center; justify-content:center; text-decoration:none; }
  #back { background:#ffd400; color:#000; }
  #retry { background:#24466f; color:#fff; }
  #yt { background:#d00; color:#fff; }
  #frameWrap { flex:1; position:relative; }
  iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .loading { position:absolute; inset:0; z-index:3; display:flex; align-items:center;
             justify-content:center; flex-direction:column; gap:14px; padding:24px;
             background:#050505; color:#fff; text-align:center; font-size:22px; }
  .loading .spinner { width:42px; height:42px; border:4px solid #555;
                      border-top-color:#ffd400; border-radius:50%;
                      animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  /* Landscape video mode: fill the whole screen and keep useful controls visible. */
  #player:fullscreen { width:100vw; height:100vh; background:#000; }
  #player:fullscreen #frameWrap { position:absolute; inset:0; flex:none; }
  #player:fullscreen #bar { position:absolute; z-index:5; top:0; left:0; right:0;
                            background:transparent; pointer-events:none; }
  #player:fullscreen #bar button { pointer-events:auto; flex:0 0 auto; width:auto;
                                   min-width:104px; min-height:48px; font-size:18px; opacity:.88; }
  #player:fullscreen #yt { display:flex; pointer-events:auto; flex:0 0 auto; width:auto;
                                  max-width:44%; min-height:48px; padding:0 12px; font-size:16px; opacity:.92; }
  #player:fullscreen #hint { display:none; }
  #hint { color:#ccc; font-size:18px; text-align:center; padding:10px; }

  .web-intro { position:fixed; inset:0; z-index:9999; display:flex; flex-direction:column;
    align-items:center; justify-content:space-between; padding:clamp(24px,5vh,54px) 16px;
    overflow:hidden; color:#f5f1e8; background:radial-gradient(ellipse at 50% 48%,#092b60 0%,#061635 50%,#100621 100%);
    opacity:1; transition:opacity 400ms ease; }
  .web-intro.leaving { opacity:0; pointer-events:none; }
  .web-intro[hidden] { display:none; }
  .intro-frame { position:absolute; inset:14px; border:2px solid rgba(217,177,101,.78); border-radius:22px; pointer-events:none; }
  .intro-rings { position:absolute; left:50%; top:49%; width:min(112vw,95vh); aspect-ratio:1; transform:translate(-50%,-50%); pointer-events:none; }
  .intro-rings::before,.intro-rings::after { content:""; position:absolute; inset:7%; border:2px solid rgba(72,176,255,.35); border-radius:50%;
    box-shadow:0 0 18px rgba(50,169,255,.16), inset 0 0 18px rgba(50,169,255,.12); animation:ripple 2.6s ease-out infinite; }
  .intro-rings::after { inset:18%; border-color:rgba(237,195,113,.66); animation-delay:.55s; }
  @keyframes ripple { 0%{transform:scale(.88);opacity:.45} 70%{opacity:.95} 100%{transform:scale(1.08);opacity:.25} }
  .intro-top { position:relative; z-index:1; display:flex; align-items:center; justify-content:center; gap:10px; font-size:clamp(16px,2.2vw,24px); font-weight:750; text-shadow:0 2px 10px #000; }
  .intro-live { display:inline-flex; align-items:center; gap:6px; border-radius:8px; background:#dc1634; padding:7px 12px; box-shadow:0 0 20px rgba(255,35,60,.36); animation:livePulse 1.25s ease-in-out infinite; }
  .intro-live-dot { width:9px; height:9px; background:white; border-radius:50%; }
  @keyframes livePulse { 50%{box-shadow:0 0 27px rgba(255,35,60,.75);transform:scale(1.025)} }
  .intro-logo { position:absolute; z-index:1; left:50%; top:49%; width:min(74vw,38vh,360px); height:auto; aspect-ratio:1/1;
    transform:translate(-50%,-50%); object-fit:contain; filter:drop-shadow(0 0 18px rgba(45,162,255,.3)); animation:logoPulse 1.9s ease-in-out infinite; }
  @keyframes logoPulse { 0%,100%{scale:1} 50%{scale:1.025} }
  .intro-bottom { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center; margin-top:auto; }
  .intro-dots { display:flex; gap:10px; align-items:center; justify-content:center; }
  .intro-dots span { display:block; width:clamp(5px,1vw,10px); height:clamp(5px,1vw,10px); border-radius:50%; background:#e8bd70; animation:dotPulse 1.05s ease-in-out infinite; }
  .intro-dots span:nth-child(2n){animation-delay:.12s}.intro-dots span:nth-child(3n){animation-delay:.24s}.intro-dots span:nth-child(4n){animation-delay:.36s}
  @keyframes dotPulse { 0%,100%{opacity:.45;transform:scale(.82)} 50%{opacity:1;transform:scale(1.25)} }
  .intro-loading { color:#f3dfb5; font-size:clamp(14px,1.8vw,19px); font-weight:700; text-shadow:0 1px 8px #000; }
  .intro-sound { margin-top:2px; border:1px solid rgba(238,201,128,.6); color:#f7e4bc; background:rgba(5,16,43,.7); padding:8px 14px; border-radius:18px; font:inherit; font-size:14px; }
  .intro-sound[hidden] { display:none; }
  @media (prefers-reduced-motion: reduce) { .intro-rings::before,.intro-rings::after,.intro-live,.intro-logo,.intro-dots span { animation:none; } }
</style>
</head>
<body>

<section id="webIntro" class="web-intro" aria-label="Malayalam News introduction">
  <div class="intro-frame"></div><div class="intro-rings"></div>
  <div class="intro-top"><span class="intro-live"><span class="intro-live-dot"></span> LIVE</span><span>പ്രക്ഷേപണം</span></div>
  <img class="intro-logo" src="malayalam-news-logo.webp" alt="Malayalam News logo">
  <div class="intro-bottom">
    <div class="intro-dots" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <div class="intro-loading">വാർത്തകൾ സജ്ജമാകുന്നു...</div>
    <button id="introSound" class="intro-sound" type="button">♫ ശബ്ദം ഓണാക്കുക</button>
  </div>
  <audio id="introAudio" preload="auto" src="startup_jingle.wav"></audio>
</section>

<header>വാർത്താ ചാനലുകൾ<small>ഒരു ചാനലിൽ തൊടുക</small></header>
<main id="grid"></main>

<section id="player" aria-label="Live news">
  <div id="bar">
    <button id="back">⬅ തിരികെ</button>
    <button id="retry" type="button">↻ വീണ്ടും ശ്രമിക്കുക</button>
    <a id="yt">YouTube-ൽ തുറക്കുക</a>
  </div>
  <div id="frameWrap"></div>
  <div id="hint">വീഡിയോ വന്നില്ലെങ്കിൽ ചുവന്ന ബട്ടൺ അമർത്തുക</div>
</section>

<script>
// To add/remove a channel: edit this list. "id" is the YouTube channel ID (starts with UC).
// Optional logo: put a file named <key>.png in the logos folder.
const CHANNELS = [
  { key:"asianet",     ml:"ഏഷ്യാനെറ്റ് ന്യൂസ്", en:"Asianet News",     id:"UCf8w5m0YsRa8MHQ5bwSGmbw", color:"#c8102e" },
  { key:"manorama",    ml:"മനോരമ ന്യൂസ്",       en:"Manorama News",    id:"UCP0uG-mcMImgKnJz-VjJZmQ", color:"#b3001b", directUrl:"https://www.manoramanews.com/live-tv.html", fallbackUrl:"https://www.manoramanews.com/live-tv.html", fallbackLabel:"മനോരമ Live TV തുറക്കുക" },
  { key:"mathrubhumi", ml:"മാതൃഭൂമി ന്യൂസ്",    en:"Mathrubhumi News", id:"UCwXrBBZnIh2ER4lal6WbAHw", color:"#0a4d8c" },
  { key:"twentyfour",  ml:"ട്വന്റിഫോർ ന്യൂസ്",   en:"24 News",          id:"UCup3etEdjyF1L3sRbU-rKLw", color:"#e4572e" },
  { key:"reporter",    ml:"റിപ്പോർട്ടർ ടിവി",   en:"Reporter TV",      id:"UCFx1nseXKTc1Culiu3neeSQ", color:"#1b6e3c" },
  { key:"kairali",     ml:"കൈരളി ന്യൂസ്",       en:"Kairali News",     id:"UCnEvxaWfVL91XIYuyQRO5QA", color:"#a4161a", directUrl:"https://www.youtube.com/@kairalinews/live", fallbackUrl:"https://www.youtube.com/@kairalinews/live", fallbackLabel:"Kairali News Live തുറക്കുക" },
  { key:"janam",       ml:"ജനം ടിവി",           en:"Janam TV",         id:"UCNVkxRPqsBNejO6B9thG9Xw", embedId:"T9Ol2JHqKlM", color:"#e07a00", fallbackUrl:"https://www.youtube.com/watch?v=T9Ol2JHqKlM", fallbackLabel:"YouTube-ൽ തുറക്കുക" },
  { key:"mediaone",    ml:"മീഡിയവൺ",           en:"MediaOne",         id:"UC-f7r46JhYv78q5pGrO6ivA", color:"#5b2a86" }
];

const grid = document.getElementById("grid");
const player = document.getElementById("player");
const wrap = document.getElementById("frameWrap");
const yt = document.getElementById("yt");
const retry = document.getElementById("retry");

function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

CHANNELS.forEach(ch => {
  const b = document.createElement("button");
  b.className = "tile";
  b.setAttribute("aria-label", ch.en);
  b.innerHTML = '<div class="logo"></div><div class="name">' + esc(ch.ml) + '</div>';
  const logoBox = b.querySelector(".logo");
  // Paint a usable tile immediately; replace the label when the logo arrives.
  // Lazy, async logo fetches keep off-screen images from delaying first paint.
  const placeholder = document.createElement("div");
  placeholder.className = "badge";
  placeholder.style.background = ch.color;
  placeholder.textContent = ch.en;
  logoBox.appendChild(placeholder);
  const img = new Image();
  img.alt = ch.en;
  img.decoding = "async";
  img.loading = "lazy";
  img.onload = () => logoBox.replaceChildren(img);
  img.onerror = () => {}; // keep the readable placeholder
  img.src = "logos/" + ch.key + ".png";
  b.addEventListener("click", () => openChannel(ch));
  grid.appendChild(b);
});

function openChannel(ch) {
  // Some broadcasters do not allow their live stream to play through YouTube's live_stream embed endpoint.
  // Open their official player page directly so playback does not depend on an unavailable embed.
  if (ch.directUrl) {
    window.location.href = ch.directUrl;
    return;
  }
  wrap.innerHTML = "";
  const loading = document.createElement("div");
  loading.className = "loading";
  loading.setAttribute("role", "status");
  loading.setAttribute("aria-live", "polite");
  loading.innerHTML = '<div class="spinner" aria-hidden="true"></div><div>ചാനൽ ലോഡ് ചെയ്യുന്നു…</div><div class="loadingNote">വീഡിയോ തുടങ്ങാൻ കുറച്ച് നിമിഷങ്ങൾ എടുത്തേക്കാം</div>';
  wrap.appendChild(loading);

  const f = document.createElement("iframe");
  f.src = ch.embedId
    ? "https://www.youtube.com/embed/" + encodeURIComponent(ch.embedId) + "?autoplay=1&playsinline=1&rel=0"
    : "https://www.youtube.com/embed/live_stream?channel=" + encodeURIComponent(ch.id) + "&autoplay=1&playsinline=1&rel=0";
  f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
  f.allowFullscreen = true;
  f.addEventListener("load", () => {
    setTimeout(() => { if (loading.isConnected) loading.remove(); }, 900);
  }, { once: true });
  wrap.appendChild(f);
  // A document-load event does not prove that a video has started playing.
  // Keep the permanent fallback hint and use the retry button when needed.
  yt.href = ch.fallbackUrl || ("https://www.youtube.com/channel/" + ch.id + "/live");
  yt.textContent = ch.fallbackLabel || "YouTube-ൽ തുറക്കുക";
  player.classList.add("on");
  // The native APK watches this hash to rotate into landscape. The fullscreen
  // request also works in browsers that support the Fullscreen API.
  history.pushState({ playing:true, channel:ch.key }, "", "#playing=" + encodeURIComponent(ch.key));
  if (typeof player.requestFullscreen === "function") {
    const request = player.requestFullscreen();
    if (request && typeof request.then === "function") {
      request.then(() => {
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock("landscape").catch(() => {});
        }
      }).catch(() => {});
    }
  } else if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock("landscape").catch(() => {});
  }
}
retry.addEventListener("click", () => {
  const currentFrame = wrap.querySelector("iframe");
  if (!currentFrame) return;
  const previousSrc = currentFrame.src;
  const loading = document.createElement("div");
  loading.className = "loading";
  loading.setAttribute("role", "status");
  loading.setAttribute("aria-live", "polite");
  loading.innerHTML = '<div class="spinner" aria-hidden="true"></div><div>വീണ്ടും ലോഡ് ചെയ്യുന്നു…</div>';
  wrap.prepend(loading);
  currentFrame.addEventListener("load", () => {
    setTimeout(() => { if (loading.isConnected) loading.remove(); }, 700);
  }, { once: true });
  currentFrame.src = previousSrc;
});

function closePlayer() {
  if (document.fullscreenElement && document.exitFullscreen) {
    const exit = document.exitFullscreen();
    if (exit && typeof exit.catch === "function") exit.catch(() => {});
  }
  if (screen.orientation && screen.orientation.unlock) {
    try { screen.orientation.unlock(); } catch (_) {}
  }
  player.classList.remove("on");
  wrap.innerHTML = "";   // stops the video
}
document.getElementById("back").addEventListener("click", () => {
  if (history.state && history.state.playing) history.back(); else closePlayer();
});
window.addEventListener("popstate", closePlayer);   // phone's own back button works too


const isNativeApp = new URLSearchParams(window.location.search).get("app") === "1";
const webIntro = document.getElementById("webIntro");
const introAudio = document.getElementById("introAudio");
const introSound = document.getElementById("introSound");

if (isNativeApp) {
  // Android plays the same intro natively while GeckoView loads this page beneath it.
  webIntro.hidden = true;
  introAudio.pause();
} else {
  let introStarted = false;
  let introElapsed = false;
  let introEnded = false;
  let introExitStarted = false;
  let visualTimer = null;

  function maybeCloseWebIntro() {
    if (!introElapsed || (introStarted && !introEnded) || introExitStarted) return;
    introExitStarted = true;
    webIntro.classList.add("leaving");
    setTimeout(() => { webIntro.hidden = true; }, 420);
  }

  function armVisualTimer(ms) {
    if (visualTimer) clearTimeout(visualTimer);
    visualTimer = setTimeout(() => {
      introElapsed = true;
      maybeCloseWebIntro();
    }, ms);
  }

  function startWebJingle() {
    if (introStarted) return;
    introAudio.volume = 0;
    const playResult = introAudio.play();
    if (playResult && typeof playResult.then === "function") {
      playResult.then(() => {
        introStarted = true;
        introSound.hidden = true;
        const rampStart = performance.now();
        function rampVolume(now) {
          if (introAudio.paused || introAudio.ended) return;
          introAudio.volume = Math.min(1, (now - rampStart) / 320);
          if (introAudio.volume < 1) requestAnimationFrame(rampVolume);
        }
        requestAnimationFrame(rampVolume);
        armVisualTimer(3000);
      }).catch(() => {
        // Sound autoplay is blocked by some browsers until the user taps.
        introSound.hidden = false;
        armVisualTimer(5000);
      });
    } else {
      introStarted = true;
      armVisualTimer(3000);
    }
  }

  introSound.addEventListener("click", () => {
    if (introExitStarted) return;
    startWebJingle();
  });
  introAudio.addEventListener("ended", () => {
    introEnded = true;
    maybeCloseWebIntro();
  });
  introAudio.addEventListener("error", () => {
    introEnded = true;
    introStarted = false;
    maybeCloseWebIntro();
  });

  startWebJingle();
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
