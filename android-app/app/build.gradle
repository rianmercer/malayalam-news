plugins {
    id "com.android.application"
}

android {
    namespace "com.rianmercer.malayalamnews"
    compileSdk 36

    // Preserve uBlock Origin's _locales folder; underscore-prefixed asset directories are excluded by default.
    androidResources {
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~"
    }

    defaultConfig {
        applicationId "com.rianmercer.malayalamnews"
        minSdk 26
        targetSdk 34
        versionCode 12
        versionName "1.8.1"
        ndk {
            abiFilters "arm64-v8a"
        }
    }
}

dependencies {
    implementation "org.mozilla.geckoview:geckoview:153.0.20260810162159"
}
