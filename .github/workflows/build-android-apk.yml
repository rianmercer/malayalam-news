name: Build Malayalam News APK

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "index.html"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Bundle official uBlock Origin extension
        run: |
          mkdir -p android-app/app/src/main/assets/ublock
          curl --fail --location --retry 3 \
            "https://github.com/gorhill/uBlock/releases/download/1.75.0/uBlock0_1.75.0.firefox.signed.xpi" \
            --output /tmp/uBlock0.firefox.signed.xpi
          unzip -q /tmp/uBlock0.firefox.signed.xpi -d android-app/app/src/main/assets/ublock
          test -f android-app/app/src/main/assets/ublock/manifest.json
          test -f android-app/app/src/main/assets/ublock/_locales/en/messages.json
          grep -n '"id"' android-app/app/src/main/assets/ublock/manifest.json || true

      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug

      - name: Verify uBlock locale is packaged in APK
        run: unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep -Fq "assets/ublock/_locales/en/messages.json"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Malayalam-News-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
